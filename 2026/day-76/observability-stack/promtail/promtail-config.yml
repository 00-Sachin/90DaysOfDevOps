server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    
    pipeline_stages:
      # 1. Decode the inner Docker JSON container payload
      - json:
          expressions:
            log: log
            stream: stream

      # 2. Extract the container hash ID from the end of the file path, 
      #    ignoring any prefixes (/var/lib or /mnt/myvolume)
      - regex:
          source: filename
          expression: '.*/containers/(?P<container_name>[a-f0-9]+)/.*'

      # 3. Create a clean searchable index key
      - labels:
          container_name:
          stream:



